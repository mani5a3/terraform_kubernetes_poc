# ExternalName Service is used to map a Kubernetes Service name to an external DNS name (outside the cluster).
# it only creates a DNS CNAME record inside the cluster.

# when pod calls: user-db.default.svc.cluster.local Kubernetes DNS will redirect it to: usermgmtdb.cxojydmxwly6.us-east-1.rds.amazonaws.com
---
apiVersion: v1
kind: Service
metadata:
  name: user-db
spec:
  type: ExternalName
  externalName: usermgmtdb.cxojydmxwly6.us-east-1.rds.amazonaws.com